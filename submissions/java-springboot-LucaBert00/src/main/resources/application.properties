spring.application.name=conduit

# SPEC runtime contract: HOST/PORT from the environment.
# Benchmark box sets 0.0.0.0:80 for direct front, test/run.sh sets 127.0.0.1:3000.
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}

# Multicore model: every request on its own virtual thread (no 200-thread platform pool).
spring.threads.virtual.enabled=true

# Direct front: we hold tens of thousands of keep-alive connections ourselves
# (no Nginx in front). Caps raised vs the video baseline (20000/1024).
server.tomcat.keep-alive-timeout=65s
server.tomcat.max-connections=50000
server.tomcat.accept-count=2048
server.tomcat.max-keep-alive-requests=-1

# HikariCP: maximumPoolSize = DB_POOL_SIZE, 5 s acquire timeout.
# start.sh defaults DB_POOL_SIZE to min(95, 10 x cores) and caps at 95 (SPEC: max_connections = 100).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# Unknown paths become NoHandlerFoundException (404 in SPEC shape), not a static-resource lookup.
spring.web.resources.add-mappings=false

# Bodies are JSON whatever the Content-Type: don't let FormContentFilter consume a PUT/DELETE body
# sent as application/x-www-form-urlencoded.
spring.mvc.formcontent.filter.enabled=false

# No per-request logging: Boot logs nothing per request by default; keep root quiet to avoid I/O stalls.
logging.level.root=WARN
logging.level.conduit=WARN
